name: Deploy SubT handoff leaderboard

on:
  push:
    branches: [main]
    paths:
      - "benchmark/px4_gazebo/model_handoff/subt_handoff_leaderboard.html"
      - ".github/workflows/deploy-subt-handoff-leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp benchmark/px4_gazebo/model_handoff/subt_handoff_leaderboard.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
